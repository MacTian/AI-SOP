version: "3.8"

services:
  sop-monitor:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./sop_definitions:/app/sop_definitions
      - ./screenshots:/app/screenshots
      - sop-db:/app/data
    environment:
      - SOP_CAMERA_DEVICE=0
      - SOP_MODEL_PATH=yolo26n.pt
      - SOP_DATABASE_URL=sqlite:///./data/sop_monitor.db
      - SOP_CONFIDENCE_THRESHOLD=0.5
      - SOP_INFERENCE_INTERVAL=0.5
      - SOP_DEFAULT_CONFIRM_FRAMES=3
      - SOP_SECRET_KEY=CHANGE_ME_TO_A_RANDOM_SECRET
      - SOP_DEFAULT_ADMIN_PASSWORD=admin123
    devices:
      - /dev/video0:/dev/video0
    restart: unless-stopped

volumes:
  sop-db:
